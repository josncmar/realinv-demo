name: Deploy original RealInv mockup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Extract original Claude Design export
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          import shutil
          target = Path('_site')
          target.mkdir()
          with ZipFile('App inmobiliaria completa.zip') as archive:
              archive.extractall(target)
          shutil.copyfile(target / 'RealInv App.dc.html', target / 'index.html')
          (target / '.nojekyll').touch()
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
